<style>

/* Layout: a dark gallery wall; the painting hangs in the upper field, a museum label sits on the wall below, alternating sides. */
:root{
  --wall:#0b0a09;          /* near-black wall: on OLED these pixels stay off */
  --wall-glow:#16130f;     /* faint warm light around the painting */
  --label-ink:#e9e1d3;     /* label text, warm paper white */
  --label-dim:#9c9284;     /* secondary label text */
  --brass:#b39563;         /* the brass rule on the label */
  --display:"Cormorant Garamond","Georgia","Times New Roman",serif;
  --body:"Golos Text","Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--wall);color:var(--label-ink);overflow:hidden}
body{font-family:var(--body);cursor:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stage{position:absolute;left:0;right:0;top:0;bottom:0;
  background:radial-gradient(ellipse at 50% 42%,var(--wall-glow) 0%,var(--wall) 62%)}
.frame{position:absolute;left:3vw;right:3vw;top:5.5vh;bottom:18vh;
  opacity:0;-webkit-transition:opacity 2.4s ease;transition:opacity 2.4s ease}
.frame.on{opacity:1}
.frame img{position:absolute;left:0;top:0;width:100%;height:100%;
  object-fit:contain;max-width:100%;
  -webkit-filter:drop-shadow(0 1.2vh 2.4vh rgba(0,0,0,.65));filter:drop-shadow(0 1.2vh 2.4vh rgba(0,0,0,.65))}
.label{position:absolute;bottom:3.2vh;max-width:58vw;
  opacity:0;-webkit-transition:opacity 1.6s ease .9s;transition:opacity 1.6s ease .9s}
.label.on{opacity:1}
.label.left{left:4.5vw;text-align:left}
.label.right{right:4.5vw;text-align:right}
.label .author{font-family:var(--body);font-weight:500;font-size:2.5vh;letter-spacing:.08em;text-transform:uppercase;color:var(--label-ink)}
.label .rule{height:2px;width:5vh;background:var(--brass);margin:1.1vh 0 1.2vh}
.label.right .rule{margin-left:auto}
.label .title{font-family:var(--display);font-style:italic;font-weight:500;font-size:3.9vh;line-height:1.08;color:var(--label-ink)}
.label .meta{font-family:var(--body);font-size:1.75vh;margin-top:1vh;color:var(--label-dim);letter-spacing:.02em}
.label .meta b{font-weight:500;color:var(--label-ink);font-variant-numeric:tabular-nums}
#hint{position:absolute;top:1.6vh;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  font-size:1.6vh;color:var(--label-dim);letter-spacing:.04em;white-space:nowrap;
  opacity:1;-webkit-transition:opacity 1.2s ease;transition:opacity 1.2s ease}
#hint.off{opacity:0}
#hint kbd{font-family:var(--body);border:1px solid var(--label-dim);border-radius:3px;padding:0 .5vh;margin:0 .3vh;color:var(--label-ink)}
#count{position:absolute;bottom:3.4vh;font-size:1.4vh;color:#5d564c;font-variant-numeric:tabular-nums;letter-spacing:.06em}
#count.left{left:4.5vw}#count.right{right:4.5vw}
@media (max-width:700px){
  .frame{left:12px;right:12px;bottom:22vh}
  .label{max-width:calc(100% - 32px)}
  .label.left,.label.right{left:16px;right:16px;text-align:left}
  .label.right .rule{margin-left:0}
  #count{display:none}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){.frame,.label{-webkit-transition:none;transition:none}}
</style>
</head>

<div id="stage">

(function(){
  var INTERVAL = 5*60*1000;
  var order = [], pos = -1, cur = 0, timer = null, captionsOn = true, side = 0;

  function shuffle(n){
    var a=[],i,j,t; for(i=0;i<n;i++)a.push(i);
    for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function el(id){return document.getElementById(id);}
  function setText(id,s){el(id).textContent=s;}

  function caption(p){
    var lab=el('lab'), cnt=el('count');
    lab.className='label';
    setTimeout(function(){
      side=1-side;
      setText('la',p.a);
      setText('lt','«'+p.t+'»');
      el('lm').innerHTML='';
      var y=document.createElement('b'); y.textContent=p.y;
      el('lm').appendChild(y);
      el('lm').appendChild(document.createTextNode('  ·  '+p.m));
      lab.className='label '+(side?'right':'left')+(captionsOn?' on':'');
      cnt.className=side?'left':'right';
      cnt.textContent=(pos+1)+' / '+order.length;
      cnt.style.visibility=captionsOn?'visible':'hidden';
    },700);
  }

  function show(step){
    if(!ART.length)return;
    if(order.length!==ART.length) order=shuffle(ART.length);
    pos+=step;
    if(pos>=order.length){ order=shuffle(ART.length); pos=0; }
    if(pos<0) pos=order.length-1;
    var p=ART[order[pos]];
    var nxt=1-cur, img=el('i'+nxt), tries=0;
    img.onload=function(){
      el('f'+nxt).className='frame on';
      el('f'+cur).className='frame';
      cur=nxt;
      caption(p);
      preload();
    };
    img.onerror=function(){ if(++tries<2){ show(step>=0?1:-1); } };
    img.alt=p.a+', «'+p.t+'», '+p.y;
    img.src=p.f;
    restart();
  }
  function preload(){
    var n=order[(pos+1)%order.length]; if(n===undefined)return;
    var im=new Image(); im.src=ART[n].f;
  }
  function restart(){ if(timer)clearInterval(timer); timer=setInterval(function(){show(1);},INTERVAL); }

  function toggleCaptions(){
    captionsOn=!captionsOn;
    var lab=el('lab');
    lab.className=lab.className.replace(' on','')+(captionsOn?' on':'');
    el('count').style.visibility=captionsOn?'visible':'hidden';
  }
  function fullscreen(){
    var d=document.documentElement, r=d.requestFullscreen||d.webkitRequestFullscreen;
    try{ if(r && !(document.fullscreenElement||document.webkitFullscreenElement)){ var x=r.call(d); if(x&&x.catch)x.catch(function(){}); } }catch(e){}
  }
  function keepAwake(){
    try{ if(navigator.wakeLock&&navigator.wakeLock.request){ navigator.wakeLock.request('screen').catch(function(){}); } }catch(e){}
  }

  document.addEventListener('keydown',function(e){
    var k=e.keyCode;
    if(k===39){show(1);e.preventDefault();}
    else if(k===37){show(-1);e.preventDefault();}
    else if(k===13||k===73){toggleCaptions();e.preventDefault();}
    else if(k===70){fullscreen();}
  });
  document.addEventListener('click',function(){ fullscreen(); keepAwake(); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden)keepAwake(); });

  setTimeout(function(){ el('hint').className='off'; },20000);
  keepAwake();
  show(1);
})();
</script>
